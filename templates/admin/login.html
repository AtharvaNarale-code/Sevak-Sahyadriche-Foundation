{% extends "base.html" %}

{% block title %}Admin Login — Sevak Sahyadriche{% endblock %}

{% block content %}

<style>
  .admin-login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4efe5;
    padding: 30px 20px;
    position: relative;
    overflow: hidden;
  }

  /* subtle background shapes */
  .admin-login-page::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: #e8dccb;
    top: -250px;
    right: -150px;
    opacity: 0.45;
  }

  .admin-login-page::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #e9dfd0;
    bottom: -220px;
    left: -150px;
    opacity: 0.5;
  }

  .login-card {
    width: 100%;
    max-width: 430px;
    background: #fffdf9;
    border: 1px solid #ded4c6;
    border-radius: 16px;
    padding: 42px;
    box-shadow: 0 18px 45px rgba(45, 29, 22, 0.12);
    position: relative;
    z-index: 1;
  }

  .login-brand {
    text-align: center;
    margin-bottom: 30px;
  }

  .login-brand h1 {
    margin: 0;
    color: #3b261d;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.2;
  }

  .login-brand .brand-line {
    width: 45px;
    height: 3px;
    background: #b77a3d;
    margin: 14px auto 16px;
    border-radius: 10px;
  }

  .login-brand p {
    margin: 0;
    color: #776b61;
    font-size: 13px;
    line-height: 1.5;
  }

  .login-heading {
    margin-bottom: 24px;
  }

  .login-heading h2 {
    margin: 0 0 6px;
    color: #2d211b;
    font-size: 23px;
    font-weight: 700;
  }

  .login-heading span {
    color: #81766d;
    font-size: 13px;
  }

  .login-form .form-group {
    margin-bottom: 19px;
  }

  .login-form label {
    display: block;
    margin-bottom: 7px;
    color: #4c3c33;
    font-size: 13px;
    font-weight: 600;
  }

  .login-form .form-control {
    width: 100%;
    height: 45px;
    padding: 0 13px;
    border: 1px solid #cfc4b6;
    border-radius: 8px;
    background: #ffffff;
    color: #2d211b;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .login-form .form-control:focus {
    border-color: #a66c38;
    box-shadow: 0 0 0 3px rgba(166, 108, 56, 0.13);
  }

  .login-button {
    width: 100%;
    height: 46px;
    margin-top: 5px;
    border: none;
    border-radius: 8px;
    background: #523225;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  }

  .login-button:hover {
    background: #3d251b;
    box-shadow: 0 7px 18px rgba(61, 37, 27, 0.2);
    transform: translateY(-1px);
  }

  .login-button:active {
    transform: translateY(0);
  }

  .login-footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #ebe3d8;
    color: #978c82;
    font-size: 11px;
  }

  @media (max-width: 500px) {
    .login-card {
      padding: 32px 24px;
    }

    .login-brand h1 {
      font-size: 29px;
    }
  }
</style>

<div class="admin-login-page">

  <div class="login-card">

    <div class="login-brand">
      <h1>सेवक सह्याद्रीचे</h1>
      <div class="brand-line"></div>
      <p>Sevak Sahyadriche Foundation</p>
    </div>

    <div class="login-heading">
      <h2>Admin Login</h2>
      <span>Sign in to manage the foundation website</span>
    </div>

    <form method="POST" class="login-form">

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          placeholder="Enter your username"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit" class="login-button">
        Log In
      </button>

    </form>

    <div class="login-footer">
      Authorized access only
    </div>

  </div>

</div>

{% endblock %}
