{% extends "base.html" %}
{% block content %}<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--border:#ddd5c8;--text:#2d211b;--muted:#75695f;--primary:#5a3828;--dark:#2d1d16;--accent:#c58b45}
*{box-sizing:border-box}.admin-shell{min-height:100vh;display:flex;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.admin-sidebar{width:250px;flex:0 0 250px;background:var(--dark);color:#eadfd4;padding:28px 16px;min-height:100vh;position:sticky;top:0}
.sidebar-brand{font-size:22px;font-weight:700;padding:0 14px 24px;border-bottom:1px solid #ffffff1c;margin-bottom:22px}.sidebar-title{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#bcaea2;font-weight:700;margin:20px 14px 8px}
.admin-sidebar a{display:flex;align-items:center;gap:10px;color:#eadfd4;text-decoration:none;padding:11px 14px;border-radius:9px;margin:3px 0;font-size:14px}.admin-sidebar a:hover{background:#ffffff12;color:#fff}.admin-sidebar a.active{background:#5a3828;color:#fff;box-shadow:inset 3px 0 var(--accent)}
.admin-content{flex:1;min-width:0;padding:34px 42px}.admin-topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.admin-topbar h1{font-size:30px;margin:0}.admin-subtitle{color:var(--muted);font-size:14px;margin:7px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:8px;padding:10px 16px;text-decoration:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#40261c}.btn-sm{padding:8px 12px;font-size:13px}.btn-ghost{background:var(--card);border-color:var(--border);color:var(--text)}.btn-danger{background:#fff3f1;border-color:#e4b4ae;color:#a9473f}
.dash-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:34px}.dash-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px 24px;box-shadow:0 8px 25px #2d211b12}.dash-card.accent{border-top:3px solid var(--accent)}.dash-card .num{font-size:30px;font-weight:800;margin-bottom:5px}.dash-card .label{font-size:13px;color:var(--muted)}
.section-heading{font-size:18px;margin:0 0 14px}.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 25px #2d211b12}.admin-table{width:100%;border-collapse:collapse;min-width:700px}.admin-table th{background:#f0eadf;color:#5d5148;font-size:12px;text-transform:uppercase;letter-spacing:.55px;text-align:left;padding:13px 16px;border-bottom:1px solid var(--border)}.admin-table td{padding:14px 16px;border-bottom:1px solid #ebe4da;font-size:14px;vertical-align:middle}.admin-table tbody tr:last-child td{border:0}.admin-table tbody tr:hover{background:#fcfaf5}.action-links{display:flex;gap:7px;flex-wrap:wrap}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.status-dot.on{background:#4b8b55}.status-dot.off{background:#a9a096}
.empty-state{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:48px 20px;text-align:center;color:var(--muted)}.admin-form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;box-shadow:0 8px 25px #2d211b12}.form-group{margin-bottom:18px}.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#51463e}.form-control{width:100%;padding:11px 12px;border:1px solid #cfc5b9;border-radius:7px;background:#fff;color:var(--text);font:inherit}.form-control:focus{outline:none;border-color:#a87543;box-shadow:0 0 0 3px #c58b4526}.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.checkbox-row{display:flex;align-items:center;gap:9px;margin:4px 0 22px;font-size:14px}.checkbox-row input{accent-color:var(--primary)}.current-img-preview{display:block;max-width:180px;max-height:120px;object-fit:cover;border-radius:7px;margin:10px 0}.inline-form{display:inline}
@media(max-width:800px){.admin-sidebar{width:210px;flex-basis:210px}.admin-content{padding:26px 20px}.dash-cards{grid-template-columns:1fr}}@media(max-width:650px){.admin-shell{display:block}.admin-sidebar{position:static;width:100%;min-height:auto;padding:14px}.admin-sidebar a{display:inline-flex}.admin-content{padding:22px 14px}.admin-topbar{flex-direction:column;align-items:flex-start}.form-row-2{grid-template-columns:1fr}}
</style>
<div class="admin-shell"><aside class="admin-sidebar">
<div class="sidebar-brand">सेवक सह्याद्रीचे</div>
<div class="sidebar-title">Manage</div>
<a href="{{ url_for('admin_dashboard') }}" class="{{ 'active' if request.endpoint=='admin_dashboard' }}">Dashboard</a>
<a href="{{ url_for('admin_treks') }}" class="{{ 'active' if request.endpoint in ['admin_treks','admin_trek_new','admin_trek_edit'] }}"> Treks &amp; Events</a>
<a href="{{ url_for('admin_messages') }}" class="{{ 'active' if request.endpoint=='admin_messages' }}">Contact Messages</a>
<div class="sidebar-title">Account</div>
<a href="{{ url_for('admin_change_password') }}" class="{{ 'active' if request.endpoint=='admin_change_password' }}">Change Password</a>
<a href="{{ url_for('home') }}">🌐 View Public Site</a><a href="{{ url_for('admin_logout') }}">Log Out</a>
</aside><main class="admin-content">{% block admin_content %}{% endblock %}</main></div>
{% endblock %}
