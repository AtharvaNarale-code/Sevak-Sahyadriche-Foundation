{% extends "base.html" %}
{% block content %}
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="sidebar-title">Manage</div>
    <a href="{{ url_for('admin_dashboard') }}" class="{{ 'active' if request.endpoint=='admin_dashboard' }}">📊 Dashboard</a>
    <a href="{{ url_for('admin_treks') }}" class="{{ 'active' if request.endpoint in ['admin_treks','admin_trek_new','admin_trek_edit'] }}">🏔️ Treks &amp; Events</a>
    <a href="{{ url_for('admin_messages') }}" class="{{ 'active' if request.endpoint=='admin_messages' }}">✉️ Contact Messages</a>
    <div class="sidebar-title">Account</div>
    <a href="{{ url_for('admin_change_password') }}" class="{{ 'active' if request.endpoint=='admin_change_password' }}">🔑 Change Password</a>
    <a href="{{ url_for('home') }}">🌐 View Public Site</a>
    <a href="{{ url_for('admin_logout') }}">🚪 Log Out</a>
  </aside>
  <div class="admin-content">
    {% block admin_content %}{% endblock %}
  </div>
</div>
{% endblock %}
